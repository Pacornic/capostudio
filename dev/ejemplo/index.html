<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo de ejemplo</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#101826;color:#eef2f6;display:flex;align-items:center;justify-content:center;}
  .box{text-align:center;padding:28px;}
  h1{font-weight:600;margin:0 0 6px;}
  p{color:#9fb0c0;margin:0 0 24px;}
  .dice{font-size:5rem;line-height:1;margin:10px 0 20px;}
  button{font-size:1rem;padding:12px 22px;border-radius:10px;border:0;background:#e0a94a;color:#101826;font-weight:600;cursor:pointer;}
  button:active{transform:scale(.97);}
  .score{margin-top:18px;color:#9fb0c0;font-size:.95rem;}
</style>
</head>
<body>
  <div class="box">
    <h1>Prototipo de ejemplo</h1>
    <p>Sustituye esta carpeta por tu propio prototipo jugable.</p>
    <div class="dice" id="dice">🎲</div>
    <button id="roll">Tirar el dado</button>
    <div class="score" id="score">Tiradas: 0 · Última: —</div>
  </div>
  <script>
    var faces=["⚀","⚁","⚂","⚃","⚄","⚅"], rolls=0;
    document.getElementById('roll').addEventListener('click',function(){
      var v=1+Math.floor(Math.random()*6); rolls++;
      document.getElementById('dice').textContent=faces[v-1];
      document.getElementById('score').textContent='Tiradas: '+rolls+' · Última: '+v;
    });
  </script>
</body>
</html>
