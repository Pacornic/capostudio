<div id="py-juegos">
  <style>
    #py-juegos{
      --bg:#0f1720;--card:#182432;--card2:#1f2e3f;--acc:#e0a94a;--acc2:#4aa3e0;
      --tx:#eef2f6;--mut:#9fb0c0;--line:rgba(255,255,255,.08);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--tx);background:var(--bg);max-width:1120px;margin:0 auto;
      padding:44px 22px;border-radius:16px;box-sizing:border-box;line-height:1.55;
    }
    #py-juegos *{box-sizing:border-box;}
    #py-juegos h2{font-size:2rem;margin:0 0 10px;text-align:center;}
    #py-juegos .py-bio{max-width:680px;margin:0 auto 8px;color:var(--mut);text-align:center;font-size:1.02rem;}
    #py-juegos .py-groupt{font-size:1rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--acc);
      margin:34px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line);}
    #py-juegos .py-groupt.soon{color:var(--acc2);}
    #py-juegos .py-groupt.wip{color:var(--mut);}
    #py-juegos .py-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
    #py-juegos .py-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;cursor:pointer;transition:transform .18s ease,border-color .18s ease;display:flex;flex-direction:column;}
    #py-juegos .py-card:hover{transform:translateY(-4px);border-color:var(--acc);}
    #py-juegos .py-thumb{aspect-ratio:3/4;background:#0b1119 center/cover no-repeat;position:relative;}
    #py-juegos .py-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      color:var(--mut);font-size:.85rem;text-align:center;padding:12px;}
    #py-juegos .py-cbody{padding:12px 14px;}
    #py-juegos .py-cname{font-weight:600;font-size:1.02rem;line-height:1.25;}
    #py-juegos .py-cyear{font-size:.78rem;color:var(--mut);margin-top:3px;letter-spacing:.5px;}
    #py-juegos .py-detail{display:none;}
    #py-juegos .py-back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);
      color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;margin-bottom:22px;}
    #py-juegos .py-back:hover{border-color:var(--acc);color:var(--acc);}
    #py-juegos .py-dhead{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
    #py-juegos .py-dcover{width:220px;max-width:40vw;border-radius:12px;flex:0 0 auto;background:#0b1119;}
    #py-juegos .py-dinfo{flex:1 1 280px;min-width:260px;}
    #py-juegos .py-dinfo h3{font-size:1.6rem;margin:0 0 6px;}
    #py-juegos .py-dyear{color:var(--acc);font-size:.9rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
    #py-juegos .py-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
    #py-juegos .py-stat{background:var(--card2);border-radius:10px;padding:8px 14px;min-width:82px;}
    #py-juegos .py-stat .k{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:1px;}
    #py-juegos .py-stat .v{font-size:1.1rem;font-weight:600;}
    #py-juegos .py-ddesc{color:#d6dee7;font-size:1rem;}
    #py-juegos .py-bgg{display:inline-block;margin-top:14px;color:var(--acc2);text-decoration:none;font-size:.9rem;}
    #py-juegos .py-bgg:hover{text-decoration:underline;}
    #py-juegos .py-gallt{margin:30px 0 14px;font-size:.95rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);}
    #py-juegos .py-gall{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    #py-juegos .py-gall img{width:100%;height:150px;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#0b1119;
      border:1px solid var(--line);transition:transform .15s ease;}
    #py-juegos .py-gall img:hover{transform:scale(1.03);border-color:var(--acc);}
    #py-juegos .py-nogall{color:var(--mut);font-size:.92rem;}
    #py-lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;
      z-index:99999;cursor:zoom-out;padding:24px;}
    #py-lb img{max-width:95%;max-height:92%;border-radius:8px;}
    #py-lb .x{position:absolute;top:18px;right:26px;color:#fff;font-size:2rem;cursor:pointer;line-height:1;}
    @media(max-width:520px){#py-juegos{padding:30px 14px;}#py-juegos h2{font-size:1.6rem;}#py-juegos .py-dcover{width:150px;}}
  </style>

      var html='';
      cats.forEach(function(c){
        var items=G.map(function(g,i){return {g:g,i:i};}).filter(function(o){return o.g.cat===c[0];});
        if(!items.length)return;
        html+='<div class="'+c[2]+'">'+c[1]+'</div><div class="py-grid">';
        items.forEach(function(o){html+=cardHTML(o.g,o.i);});
        html+='</div>';
      });
      groups.innerHTML=html;
      groups.querySelectorAll('.py-card').forEach(function(el){
        el.addEventListener('click',function(){showDetail(+el.getAttribute('data-idx'));});
      });
    }

    function showDetail(idx){
      var g=G[idx];var cov=COVER(g.c);
      var stats='<div class="py-stats">'+
        '<div class="py-stat"><div class="k">Jugadores</div><div class="v">'+esc(g.pl)+'</div></div>'+
        '<div class="py-stat"><div class="k">Duración</div><div class="v">'+esc(g.t)+'</div></div>'+
        '<div class="py-stat"><div class="k">Edad</div><div class="v">'+esc(g.ag)+'</div></div>'+
        (g.cat==='pub'?'<div class="py-stat"><div class="k">Año</div><div class="v">'+esc(g.y)+'</div></div>':'')+
        '</div>';
      var coverHTML=cov?'<img class="py-dcover" src="'+cov+'" alt="'+esc(g.n)+'">':'<div class="py-dcover" style="width:220px;height:280px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.85rem;text-align:center;padding:14px;">Imagen no disponible todavía</div>';
      var gall='';
      if(g.p&&g.p.length){
        gall='<div class="py-gallt">Fotos</div><div class="py-gall">'+
          g.p.map(function(t){var u=PHOTO(t);return '<img loading="lazy" src="'+u+'" data-full="'+u+'" alt="'+esc(g.n)+'">';}).join('')+'</div>';
      }else{
        gall='<div class="py-gallt">Fotos</div><p class="py-nogall">Aún no hay fotos disponibles en BGG para este juego.</p>';
      }
      detV.innerHTML='<button class="py-back">&larr; Volver a todos los juegos</button>'+
        '<div class="py-dhead">'+coverHTML+
        '<div class="py-dinfo"><h3>'+esc(g.n)+'</h3><div class="py-dyear">'+esc(g.y)+'</div>'+stats+
        '<p class="py-ddesc">'+esc(g.d)+'</p>'+
        '<a class="py-bgg" href="https://boardgamegeek.com/boardgame/'+g.i+'" target="_blank" rel="noopener">Ver ficha completa en BoardGameGeek &rarr;</a>'+
        '</div></div>'+gall;
      detV.querySelector('.py-back').addEventListener('click',showList);
      detV.querySelectorAll('.py-gall img').forEach(function(im){
        im.addEventListener('click',function(){lbImg.src=im.getAttribute('data-full');lb.style.display='flex';});
      });
      listV.style.display='none';detV.style.display='block';
      root.scrollIntoView({behavior:'smooth',block:'start'});
    }

    function showList(){detV.style.display='none';listV.style.display='block';}

    lb.addEventListener('click',function(){lb.style.display='none';lbImg.src='';});

    renderList();
  })();
  </script>
</div>
</body>
</html>
