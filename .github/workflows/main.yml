name: Actualizar juegos desde BGG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install fast-xml-parser

      - name: Actualizar data.js desde BGG
        run: node scripts/update-bgg.mjs

      - name: Guardar cambios (si los hay)
        run: |
          if [ -n "$(git status --porcelain assets/data.js)" ]; then
            git config user.name "bgg-bot"
            git config user.email "bgg-bot@users.noreply.github.com"
            git add assets/data.js
            git commit -m "Actualizar juegos desde BGG"
            git push
            echo "Cambios subidos. Vercel redesplegara solo."
          else
            echo "Sin cambios: los datos ya estaban al dia."
          fi
